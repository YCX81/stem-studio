[project]
name = "stem-studio"
version = "0.1.0"
description = "Local NVIDIA GPU audio stem separation studio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "audio-separator==0.44.3",
  "gradio==6.20.0",
  "onnxruntime==1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
stem-studio = "stemstudio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["stemstudio"]
omit = ["src/stemstudio/app.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
